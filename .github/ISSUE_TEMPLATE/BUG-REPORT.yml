name: Bug Report
description: File a bug report.
title: "[BUG]: "
labels: ["BUG"]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Zero is already better because you're here...
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: Leave your Discord username or email so we can follow up.
      placeholder: ex. @driftdjindustries
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Zero are you running?
      options:
        - 0.6.1.* (Any version before 0.6.1.r12)
        - 0.6.1.r12
      default: 0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. See driftdj.com/beta-logging.html for info on enabling and retrieving logs.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem. See driftdj.com/beta-logging.html for info on capturing screenshots.
    validations:
      required: false
